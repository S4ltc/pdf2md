# Baut pdf2md fuer Windows, macOS (Apple Silicon und Intel) und Linux, startet jedes Ergebnis einmal zur Probe
# (Start-Test: Anzeige-Engine, Oberflaeche und Python-Schnittstelle, siehe werkzeuge/bauen.py) und legt die Pakete
# als Artefakte ab. Laeuft bei jedem Push auf main, damit sich ohne eigenes Geraet zeigt, ob macOS und Linux starten,
# und als Teil des Releases (release.yml, dann mit Tag im Paketnamen und allen Tests in derselben Umgebung).
# Das Ergebnis des Start-Tests steht als Hinweis am Lauf (auch ohne Anmeldung ueber die API lesbar).
name: Bauen

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      tests:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-intel }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || 'probe' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Systempakete für Qt und den virtuellen Bildschirm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbfile1 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2 libdbus-1-3 libfontconfig1

      - name: Abhängigkeiten
        run: python -m pip install -r requirements-dev.txt pyinstaller

      - name: Tests in derselben Umgebung
        if: inputs.tests
        run: python -m pytest

      - name: Bauen
        run: python werkzeuge/bauen.py dist

      - name: Start-Test
        run: python werkzeuge/bauen.py starttest dist

      # Linux: Lizenztexte von Chromium (in Qt WebEngine) und der Drittbestandteile von Qt als Volltext, aus den
      # Quellen genau der installierten Fassungen (werkzeuge/chromium_lizenzen.py). Das Erzeugen liest ein rund
      # 550 MB grosses Quellarchiv (oder den Chromium-Baum von GitHub); deshalb im Cache, Schluessel = Versionen und
      # Stand des Werkzeugs. Schlaegt es fehl, entsteht bewusst kein Linux-Paket (bauen.paket bricht ohne die Datei ab).
      - name: Versionen für die Chromium-Lizenzen
        id: qt
        if: runner.os == 'Linux'
        shell: bash
        run: python werkzeuge/chromium_lizenzen.py --versionen | tee -a "$GITHUB_OUTPUT"

      - name: Chromium-Lizenzen aus dem Cache
        id: chromium_cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: CHROMIUM-LIZENZEN.txt
          key: chromium-lizenzen-qt${{ steps.qt.outputs.qt }}-we${{ steps.qt.outputs.webengine }}-${{ steps.qt.outputs.chromium }}-${{ steps.qt.outputs.sicherheit }}-icu${{ steps.qt.outputs.icu }}-${{ hashFiles('werkzeuge/chromium_lizenzen.py') }}

      - name: Chromium-Lizenzen erzeugen
        if: runner.os == 'Linux' && steps.chromium_cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python werkzeuge/chromium_lizenzen.py CHROMIUM-LIZENZEN.txt

      - name: Chromium-Lizenzen in den Cache
        if: runner.os == 'Linux' && steps.chromium_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: CHROMIUM-LIZENZEN.txt
          key: ${{ steps.chromium_cache.outputs.cache-primary-key }}

      - name: Paket
        shell: bash
        run: python werkzeuge/bauen.py paket "${{ matrix.name }}" "$TAG" dist

      - uses: actions/upload-artifact@v7
        with:
          name: paket-${{ matrix.name }}
          path: pdf2md-*-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 7

      - name: Ergebnisse von Start-Test und Paket als Hinweis
        if: always()
        shell: bash
        run: python werkzeuge/bauen.py hinweise "${{ matrix.name }}"
