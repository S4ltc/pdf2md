# Tests bei jedem Push auf main, auf Windows, macOS und Linux. Die .exe gibt es nur fuer Windows; macOS und Linux
# laufen hier mit, damit plattform.py und der restliche Code dort geprueft sind (siehe README, Abschnitt Systeme).
# Fehlgeschlagene Tests erscheinen zusaetzlich als Hinweis am Lauf (auch ohne Anmeldung ueber die API lesbar).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      COLUMNS: "250"          # Zusammenfassung der Fehler nicht auf 80 Zeichen kuerzen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Abhängigkeiten
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        shell: bash
        run: |
          python -m pytest -rfE --tb=short 2>&1 | tee pytest.txt
          exit ${PIPESTATUS[0]}
      - name: Fehlgeschlagene Tests als Hinweis
        if: failure()
        shell: bash
        run: |
          zeilen=$(grep -E "^(FAILED|ERROR) " pytest.txt | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Tests auf ${{ matrix.os }}::${zeilen:-siehe Protokoll}"
