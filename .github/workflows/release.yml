# Veroeffentlicht ein Release fuer Windows, macOS und Linux, ausgeloest durch einen Versions-Tag, z.B.:
#   git tag v1.2.0  und  git push origin v1.2.0      (vorher VERSION in aktualisierung.py anpassen)
# Gebaut wird bewusst hier und nicht auf dem eigenen Rechner: so stehen keine eigenen Pfade in den Programmen.
# Bauen, Start-Test und Pakete: bauen.yml; hier kommen Versionspruefung, Pruefsummen und das Release dazu.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag passt zur Version im Programm
        shell: bash
        run: |
          # Die Update-Suche vergleicht aktualisierung.VERSION mit dem neuesten Tag; passen sie nicht zusammen,
          # meldet das Programm sich selbst als veraltet (oder nie).
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' aktualisierung.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION = \"$version\" in aktualisierung.py"
            exit 1
          fi

  bauen:
    needs: version
    uses: ./.github/workflows/bauen.yml
    with:
      tag: ${{ github.ref_name }}
      tests: true

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: paket-*
          merge-multiple: true
          path: pakete
      - name: Prüfsummen
        working-directory: pakete
        run: |
          sha256sum pdf2md-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pakete/* --title "pdf2md $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
